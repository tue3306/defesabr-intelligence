# Aplica as migrações pendentes no banco de produção (Supabase).
#
# Só roda quando alguém dispara à mão (Actions → "Migrar banco de produção" →
# Run workflow). A string de conexão fica no secret DATABASE_URL do repositório,
# nunca no código. Use a string do pooler em MODO SESSÃO (porta 5432 do pooler):
# os runners do GitHub não têm IPv6, e a conexão direta do Supabase é IPv6.
name: Migrar banco de produção

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrar-producao
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Conferir o secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL não configurado (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Aplicar migrações
        run: npm run migrate

      - name: Conferir o agendamento da coleta
        run: |
          node --input-type=module -e "
          import pg from 'pg'
          import { opcoesDoCliente } from './server/src/db/conexao.js'
          const c = new pg.Client(opcoesDoCliente({ url: process.env.DATABASE_URL, env: process.env }))
          await c.connect()
          const job = await c.query(\"SELECT schedule, active FROM cron.job WHERE jobname = 'defesabr-ciclo'\").catch(() => ({ rows: [] }))
          const kev = await c.query(\"SELECT to_regclass('public.kev_vulnerabilities') IS NOT NULL AS existe\")
          console.log('Agendamento da coleta:', job.rows[0] || 'job não encontrado')
          console.log('Tabela kev_vulnerabilities:', kev.rows[0].existe ? 'criada' : 'AUSENTE')
          await c.end()
          "
