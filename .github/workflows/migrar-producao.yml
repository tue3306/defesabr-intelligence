# Aplica as migrações pendentes no banco de produção, sem reiniciar a aplicação.
#
# NA MAIORIA DOS CASOS NÃO É NECESSÁRIO: o servidor aplica as migrações e semeia
# o banco na subida, antes de abrir a porta (server/src/index.js), então um
# deploy novo no Railway já entra com o esquema em dia. Este workflow existe para
# quando se quer migrar sem publicar — ou conferir, de fora, o que o banco tem.
#
# Só roda quando alguém dispara à mão (Actions → "Migrar banco de produção" →
# Run workflow). A string de conexão fica no secret DATABASE_URL do repositório,
# nunca no código. Use a DATABASE_PUBLIC_URL do serviço Postgres: o runner do
# GitHub está fora do projeto e não alcança `postgres.railway.internal`.
name: Migrar banco de produção

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrar-producao
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Conferir o secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL não configurado (Settings → Secrets and variables → Actions). Use a DATABASE_PUBLIC_URL do Postgres no Railway."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Aplicar migrações
        run: npm run migrate

      - name: Conferir o esquema
        run: |
          node --input-type=module -e "
          import pg from 'pg'
          import { opcoesDoCliente } from './server/src/db/conexao.js'
          const c = new pg.Client(opcoesDoCliente({ url: process.env.DATABASE_URL, env: process.env }))
          await c.connect()
          const migracoes = await c.query('SELECT nome FROM schema_migrations ORDER BY nome')
          const kev = await c.query(\"SELECT to_regclass('public.kev_vulnerabilities') IS NOT NULL AS existe\")
          const tamanho = await c.query('SELECT pg_size_pretty(pg_database_size(current_database())) AS tamanho')
          console.log('Migrações aplicadas:', migracoes.rows.map((r) => r.nome).join(', '))
          console.log('Tabela kev_vulnerabilities:', kev.rows[0].existe ? 'criada' : 'AUSENTE')
          console.log('Tamanho do banco:', tamanho.rows[0].tamanho)
          await c.end()
          "
