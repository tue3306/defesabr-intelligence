name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# O QUE ESTE WORKFLOW VERIFICA, E POR QUE VERIFICA TANTO
#
# Ele rodava `npm run build` e mais nada. Um CI assim passa mesmo com o servidor
# inteiro quebrado, porque o build é só o Vite.
#
#   POSTGRES DE VERDADE. O servidor fala com Postgres (Supabase em produção), e
#   o esquema vive em `supabase/migrations/`. O job sobe um `postgres:17` como
#   serviço e aplica as MESMAS migrações que vão para produção — um CI contra
#   outro banco, ou sem banco, aprovaria SQL que o Supabase recusa.
#
#   NODE 24. `package.json` declara `engines: >=24`; o CI usa a versão que o
#   projeto exige, não a que por acaso estava à mão.
#
#   AS SUÍTES RODAM. `npm run test:server` testa o servidor contra o banco
#   `defesabr_test`; `npm run check` e `npm run check:auth` sobem contra a API
#   real (incluindo as rotas que MUDAM estado). Um CI verde que nunca as
#   executou dá confiança sem base — o mesmo defeito que este projeto já
#   corrigiu num indicador de saúde que não media nada.
#
# Dois bancos no mesmo serviço: `defesabr` (a API que as suítes de fora
# consultam) e `defesabr_test` (os testes do servidor, que recriam o schema a
# cada arquivo). Os testes recusam qualquer banco que não termine em `_test`.
# As credenciais abaixo são descartáveis: o banco nasce e morre com o job.
# -----------------------------------------------------------------------------

jobs:
  verificar:
    name: Lint, build e suítes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: defesabr
          POSTGRES_PASSWORD: defesabr
          POSTGRES_DB: defesabr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://defesabr:defesabr@localhost:5432/defesabr
      TEST_DATABASE_URL: postgres://defesabr:defesabr@localhost:5432/defesabr_test
      # A rota de ciclo exige segredo (>= 16 caracteres); sem ele a suíte de
      # autorização não consegue provar que a rota recusa quem não o conhece.
      CRON_SECRET: ci-segredo-descartavel-do-ciclo
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-senha-descartavel
      API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          # A versão que `engines` exige.
          node-version: '24'
          cache: 'npm'

      - name: Instalar
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Criar o banco de testes
        env:
          PGPASSWORD: defesabr
        run: psql -h localhost -U defesabr -d defesabr -c 'CREATE DATABASE defesabr_test'

      # Esquema, fontes padrão e conta de administrador no banco `defesabr`.
      - name: Migrar
        run: npm run migrate

      - name: Testes do servidor
        run: npm run test:server

      # `COLLECT_INTERVAL_MINUTES=0` desliga o agendador para que ele não
      # colete por cima das suítes.
      - name: Subir a API
        run: |
          COLLECT_INTERVAL_MINUTES=0 PORT=3001 npm start &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "API no ar"; exit 0
            fi
            sleep 2
          done
          echo "A API não respondeu em 120s"; exit 1

      - name: Suíte de forma das respostas
        run: npm run check

      - name: Suíte de autorização
        run: npm run check:auth
